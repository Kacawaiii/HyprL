name: sources-ci

on:
  push:
    branches: [feat/phase5, "agents/**"]
  pull_request:
    branches: [feat/phase5]

concurrency:
  group: sources-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Only what the suites import: the runtime floor (pandas, numpy, requests),
      # cryptography (TLS tests), the ml extra (the paper views import xgboost) and the
      # pinned equity calendar (research protection and comparison protocol suites).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pandas numpy requests cryptography \
            scikit-learn xgboost joblib pandas_market_calendars==5.4.0 \
            jsonschema==4.26.0 openapi-spec-validator==0.9.0
      - name: Official-event suites
        run: |
          python -m pytest tests/crypto/test_fomc_*.py tests/crypto/test_sources_primitives.py \
            tests/crypto/test_edgar_slice.py tests/crypto/test_app_api*.py tests/crypto/test_ops_server.py \
            tests/crypto/test_equity_api.py tests/api -q
      - name: Shared platform contracts and snapshots
        run: python -m pytest tests/platform -q
      - name: Synthetic Model Lab datasets, adapters, jobs, experiments and API
        run: python -m pytest tests/model_lab -q
      - name: Research registry, prediction ledger, monitoring and read-only API
        run: python -m pytest tests/research -q
      - name: Prospective paper trader, restricted runners, budgets, labels and API
        run: python -m pytest tests/trader_agent -q
      - name: Project-scoped B2B auth, isolation, budgets, audit, exports and OpenAPI
        run: |
          python -m scripts.trading_lab.b2b.openapi --check
          python -m pytest tests/b2b -q
      # Event features v1 and v2, protected intervals and the preregistered comparison protocol.
      - name: Event features and protocol suites
        run: |
          python -m pytest tests/crypto/test_event_features.py tests/crypto/test_event_features_v2.py \
            tests/crypto/test_research_protection.py tests/crypto/test_comparison_protocol.py \
            tests/crypto/test_comparison_protocol_v2.py -q
      # Supervised EDGAR service: ownership, resume, SIGTERM, budgets, throttle stop, deadline,
      # storage stalls and the offline closure (synthetic listings with the observed wire format).
      - name: Supervised EDGAR suites
        run: |
          python -m pytest tests/crypto/test_edgar_supervised.py tests/crypto/test_edgar_closure.py -q
      - name: Offline operations, read-only health, backup/restore and reproducible demo
        run: python -m pytest tests/ops_supervision -q
      # Local `hyprl` CLI (start/stop/status/doctor/export/import, store flags) and the
      # per-product holdout guard: the proof of the local operations row, not run before.
      - name: Local operations CLI and holdout guard suites
        run: |
          python -m pytest tests/crypto/test_ops_runtime.py tests/crypto/test_ops_export.py \
            tests/crypto/test_hyprl_cli*.py tests/crypto/test_holdout_product_guard.py -q
      # The paper v2 model and replay, and the engine regressions they rely on
      # (dataset, walk-forward, signal, risk, economic backtest, paper engine).
      - name: Paper model, replay and engine suites
        run: |
          python -m pytest tests/crypto/test_paper_model_v2.py tests/crypto/test_paper_replay.py \
            tests/crypto/test_paper_shadow.py tests/crypto/test_paper_portfolio.py \
            tests/crypto/test_market_dataset.py tests/crypto/test_walk_forward.py \
            tests/crypto/test_signal_engine.py tests/crypto/test_risk_engine.py \
            tests/crypto/test_economic_backtest.py tests/crypto/test_economic_backtest_results.py -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - name: Build to a temporary directory
        run: npx vite build --outDir "$RUNNER_TEMP/web-dist" --emptyOutDir

  # The Lab journey in a real headless Chromium: the built cockpit served by an authenticated
  # loopback lab listener running real synthetic worker jobs (dataset, experiment, cancel,
  # monitoring), plus refusals, keyboard and a 390 px viewport. The token is generated per run.
  lab-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy requests cryptography scikit-learn xgboost joblib \
            pandas_market_calendars==5.4.0 jsonschema==4.26.0
          (cd apps/web && npm ci && npx vite build --outDir "$RUNNER_TEMP/web-dist" --emptyOutDir)
          mkdir -p "$RUNNER_TEMP/pw" && (cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null \
            && npm install playwright@1.56.0 && npx playwright install --with-deps chromium)
      - name: Synthetic research store for the monitoring page
        run: python -m scripts.trading_lab.research.demo --root "$RUNNER_TEMP/research" --bars 120 > /dev/null
      - name: Lab journey in Chromium
        run: |
          HYPRL_MODEL_LAB_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$HYPRL_MODEL_LAB_TOKEN"
          export HYPRL_MODEL_LAB_TOKEN
          python -m scripts.trading_lab.app_api.server --host 127.0.0.1 --port 8796 \
            --dist-root "$RUNNER_TEMP/web-dist" --model-lab-root "$RUNNER_TEMP/lab" \
            --research-root "$RUNNER_TEMP/research/registry" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:8796/api/v1/health && break; sleep 1; done
          LAB_URL=http://127.0.0.1:8796 NODE_PATH="$RUNNER_TEMP/pw/node_modules" node apps/web/e2e/lab-journey.cjs
